<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spending Analysis · Prototype</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">₪</span> Transactions <span class="crumb">/ Spending analysis</span><span class="badge">Prototype · mock data</span></div>
  <div class="scenarios" id="scenarios"></div>
</header>

<main class="page">
  <section class="card controls">
    <label>Period
      <select id="preset"></select>
    </label>
    <label>From <input type="date" id="from"></label>
    <label>To <input type="date" id="to"></label>
    <label>Compare
      <select id="compare">
        <option value="none">No comparison</option>
        <option value="prev">vs previous period</option>
        <option value="yoy">vs same period last year</option>
      </select>
    </label>
    <label>Group by <select id="groupBy"></select></label>
    <label>Time bucket <select id="gran">
      <option value="auto">Auto</option><option value="day">Day</option><option value="week">Week</option>
      <option value="month">Month</option><option value="year">Year</option></select>
    </label>
  </section>

  <section class="card filters">
    <div class="filter-add">
      <span class="muted">Add filter</span>
      <select id="f-field"></select>
      <span id="f-input"></span>
      <button class="btn" id="f-add">Add</button>
    </div>
    <div class="chips" id="chips"></div>
  </section>

  <section class="stats" id="stats"></section>

  <section class="card">
    <div class="card-head">
      <h2 id="chart-title">Spending</h2>
      <label class="toggle" id="avg-toggle"><input type="checkbox" id="showAvg" checked> Show average</label>
      <div class="tabs" id="views"></div>
    </div>
    <div id="chart" class="chart"></div>
  </section>

  <section class="card">
    <div class="card-head"><h2 id="table-title">Breakdown</h2><span class="muted small">Click any row to see its transactions</span></div>
    <div class="table-wrap" id="table"></div>
  </section>
</main>

<div class="overlay" id="overlay" hidden></div>
<aside class="drawer" id="drawer" hidden></aside>

<script src="data.js" charset="utf-8"></script>
<script src="app.js" charset="utf-8"></script>
</body>
</html>
