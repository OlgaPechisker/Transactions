[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-transactions"
version = "0.1.0"
description = "Parse Israeli credit-card statement workbooks and persist normalized transactions."
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1",
    "SQLAlchemy>=2.0.16",
    "alembic>=1.13",
    "cryptography>=42",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bank_transactions = ["py.typed"]
"bank_transactions.persistence" = [
    "migrations/*.py",
    "migrations/*.mako",
    "migrations/versions/*.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib --strict-markers"
markers = [
    "postgres: needs a real PostgreSQL 15+ database (isolated test container)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["bank_transactions"]
