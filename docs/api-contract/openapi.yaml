openapi: 3.1.0
info:
  title: Bank Transactions UI API
  version: 1.0.0-proposal
  description: |
    Current V1 planning contract. See api-contract.md for conventions and ../api-design-phase-1.md for architecture.
    Approved policies and reviewed wire-contract decisions are synchronized; detailed implementation planning remains gated.
    Planned stack is FastAPI, Uvicorn and Argon2id. Users are provisioned administratively.
    Sessions expire after 12 absolute hours without sliding extension; store token digests only.
    Bearer credentials take precedence over cookies; invalid bearer credentials return 401 without cookie fallback.
    Cookie-only mutations require X-CSRF-Token; missing/invalid CSRF returns 403 CSRF_VALIDATION_FAILED.
    Ownership follows the caller's issuer/canonical-last-four claims, not statement-holder names or file hashes.
    Sharing is out of scope. Inaccessible resources return the same 404 as missing resources.
    All monetary analytics use signed billing amounts, never original-currency totals or mixed-currency sums.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
  - sessionCookie: []
tags:
  - name: Auth
  - name: Cards
  - name: Imports
  - name: Transactions
  - name: Trips
  - name: Analysis
  - name: CurrencyValidation
  - name: Categorization

paths:
  /sessions:
    post:
      tags: [Auth]
      operationId: createSession
      summary: Sign in (Login screen)
      description: |
        Trim email and match case-insensitively; preserve passwords exactly.
        After 10 failed sign-ins in 15 minutes, throttle independently by normalized email and client IP
        with 429, using worker-shared state and no permanent account lockout.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 1 }
      responses:
        '201':
          description: Signed in. Also sets the session cookie.
          content:
            application/json:
              schema:
                type: object
                required: [token, expiresAt, user]
                properties:
                  token: { type: string }
                  expiresAt: { $ref: '#/components/schemas/Timestamp' }
                  user: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /sessions/current:
    delete:
      tags: [Auth]
      operationId: deleteCurrentSession
      summary: Sign out (top bar)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Signed out }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfValidationFailed' }

  /me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: Current user profile and counters (top bar, Profile, review nav badge)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /cards:
    get:
      tags: [Cards]
      operationId: listCards
      summary: The caller's own cards (Profile, Import identity step)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Card' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /cards/{cardId}:
    parameters:
      - $ref: '#/components/parameters/CardId'
    patch:
      tags: [Cards]
      operationId: updateCard
      summary: Set card nickname (Profile & cards)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nickname]
              properties:
                nickname: { type: [string, 'null'], maxLength: 120 }
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Card' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /imports:
    post:
      tags: [Imports]
      operationId: runImport
      summary: Dry run or real import of an uploaded workbook, optionally answering identity questions (Import steps 2-4)
      description: |
        The workbook is sent with every call; the server keeps no upload between calls.
        The client re-sends the same file for the identity re-run and for the real import.
        Identity question ids are deterministic (derived from issuer + card hint, e.g. a hash), so selections
        made against a dry-run response stay valid when the same file is re-uploaded.
        Dry runs and NEEDS_INPUT may record audit but commit no owners, accounts, cards, claims, plans or transactions.
        Creating a card reserves issuer + encrypted canonical last-four for this user. A claim owned by another user
        returns 409 DATA_ALREADY_OWNED even in a dry run, without other-user details; collisions are accepted in V1.
        The import service resolves reliable metadata or explicitly unresolved placeholders, never fabricated bank IDs.
        A global same-file guard returns 409 IMPORT_IN_PROGRESS. Card/key serialization also protects overlapping files.
        A recognized XLSX with no supported bank format returns 422 UNKNOWN_STATEMENT_FORMAT with an internal FAILED audit.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, dryRun]
              properties:
                file:
                  type: string
                  contentMediaType: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
                  description: The .xlsx statement workbook; maximum 20 MiB (20971520 bytes).
                dryRun:
                  type: boolean
                identitySelections:
                  type: string
                  contentMediaType: application/json
                  description: JSON-encoded array of IdentitySelection answering identityQuestions from a previous response.
                  contentSchema:
                    type: array
                    items: { $ref: '#/components/schemas/IdentitySelection' }
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '201':
          description: Import run recorded
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
    get:
      tags: [Imports]
      operationId: listImports
      summary: Import history
      description: |
        Runs are visible through inserted transactions belonging to the caller's claimed cards, not file ownership.
        Dry runs and runs with no visible inserted transactions (all duplicates, FAILED, NEEDS_INPUT) never appear.
        Original filenames are neither returned nor persisted; safe hash-derived audit labels may remain internal.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: sort
          in: query
          schema: { type: string, enum: [startedAt, -startedAt], default: -startedAt }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, meta]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ImportSummary' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /transactions:
    get:
      tags: [Transactions]
      operationId: listTransactions
      summary: Filtered transaction list with summary and groups (Transactions list, analysis drill-down, category-mapping table)
      description: |
        Includes all billing currencies unless billingCurrency is supplied. Amount bounds require billingCurrency.
        Counts include positive, negative and zero rows. Summaries/groups cover the entire filtered set.
        Summary/groups use BillingSummary: count, unknownBillingCurrencyCount and billingTotals with count/net per known currency.
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: month
          in: query
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
        - $ref: '#/components/parameters/CategoryFilter'
        - name: bankCategory
          in: query
          explode: true
          schema: { type: array, items: { type: string } }
        - $ref: '#/components/parameters/CustomCategoryFilter'
        - name: categorySource
          in: query
          explode: true
          schema: { type: array, items: { $ref: '#/components/schemas/CategorySource' } }
        - $ref: '#/components/parameters/CardIdFilter'
        - $ref: '#/components/parameters/CurrencyFilter'
        - $ref: '#/components/parameters/BillingCurrency'
        - $ref: '#/components/parameters/MinAmount'
        - $ref: '#/components/parameters/MaxAmount'
        - $ref: '#/components/parameters/MerchantFilter'
        - $ref: '#/components/parameters/TypeFilter'
        - $ref: '#/components/parameters/CountryFilter'
        - $ref: '#/components/parameters/TripIdFilter'
        - name: needsReview
          in: query
          description: true = has a user-visible review reason (v1 = UNKNOWN_CURRENCY only); false = has none. Internal-only reasons are ignored.
          schema: { type: boolean }
        - name: reviewReason
          in: query
          description: Has this review reason. Repeat for OR. v1 accepts UNKNOWN_CURRENCY only; any other value → 400 INVALID_FILTER.
          explode: true
          schema: { type: array, items: { $ref: '#/components/schemas/ReviewReason' } }
        - name: groupBy
          in: query
          schema: { $ref: '#/components/schemas/Dimension' }
        - name: include
          in: query
          style: form
          explode: false
          schema:
            type: array
            items: { type: string, enum: [summary, groups] }
            default: [summary]
        - name: sort
          in: query
          description: Comma-separated; prefix '-' for descending.
          schema:
            type: string
            default: -transactionDate
            pattern: '^-?(transactionDate|chargeDate|merchant|country|city|category|bankCategory|card|type|originalAmount|originalCurrency|billingAmount|effectiveRate|commission|trip|notes|reviewCount)(,-?(transactionDate|chargeDate|merchant|country|city|category|bankCategory|card|type|originalAmount|originalCurrency|billingAmount|effectiveRate|commission|trip|notes|reviewCount))*$'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, meta]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/TransactionListItem' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
                  summary: { $ref: '#/components/schemas/TransactionSummary' }
                  groups:
                    type: array
                    items: { $ref: '#/components/schemas/TransactionGroup' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /transactions/{transactionId}:
    parameters:
      - $ref: '#/components/parameters/TransactionId'
    get:
      tags: [Transactions]
      operationId: getTransaction
      summary: Transaction detail (detail panel, analysis drawer)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Transactions]
      operationId: updateTransaction
      summary: Set/clear the custom category override
      description: |
        customCategory must name an existing custom category of the caller (select-or-create: the UI creates a
        new one with POST /custom-categories first). Unknown name → 422 UNKNOWN_CATEGORY. null clears the override.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customCategory]
              properties:
                customCategory: { type: [string, 'null'], minLength: 1, maxLength: 60 }
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /filter-options:
    get:
      tags: [Transactions]
      operationId: getFilterOptions
      summary: Values for filter pickers (Transactions, Analysis, Category mapping)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FilterOptions' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /trips:
    get:
      tags: [Trips]
      operationId: listTrips
      summary: Trips with stats (Trips list, trip pickers)
      parameters:
        - name: sort
          in: query
          schema: { type: string, enum: [startDate, -startDate, name, -name], default: -startDate }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/TripSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Trips]
      operationId: createTrip
      summary: Create trip
      description: |
        Same-user trips cannot overlap on inclusive calendar dates, regardless of currency.
        Overlap returns 409 TRIP_DATE_OVERLAP. Other users' trips do not affect creation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, currency, startDate, endDate]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                currency: { $ref: '#/components/schemas/CurrencyCode' }
                startDate: { $ref: '#/components/schemas/Date' }
                endDate: { $ref: '#/components/schemas/Date' }
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '201':
          description: Created
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfValidationFailed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /trips/{tripId}:
    parameters:
      - $ref: '#/components/parameters/TripId'
    get:
      tags: [Trips]
      operationId: getTrip
      summary: Trip detail with stats and member lists
      description: |
        A transaction belongs to at most one trip. Auto members = same original currency and transaction_date in
        [startDate, endDate], minus exclusions. Same-user trips do not overlap, regardless of currency.
        A manual tag always wins, including outside the range. Removing it recalculates auto membership.
        Statistics use signed billing, separated by billing currency; trip currency is not a monetary total.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /trips/{tripId}/candidates:
    parameters:
      - $ref: '#/components/parameters/TripId'
    get:
      tags: [Trips]
      operationId: listTripCandidates
      summary: Transactions that can be tagged (Trip detail "Add transactions")
      description: Without q, returns non-members dated startDate-30d .. endDate+7d.
      parameters:
        - name: q
          in: query
          description: Candidate search across merchant name, date (YYYY-MM-DD prefix) and category.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 8 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/TransactionListItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /trips/{tripId}/tagged-transactions/{transactionId}:
    parameters:
      - $ref: '#/components/parameters/TripId'
      - $ref: '#/components/parameters/TransactionId'
    put:
      tags: [Trips]
      operationId: tagTransaction
      summary: Tag (pin) a transaction to a trip; moves it from any other trip and removes an exclusion
      description: A transaction belongs to at most one trip. Tagging it here deletes its tag on any other trip.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Tagged }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Trips]
      operationId: untagTransaction
      summary: Remove tag
      description: Returns 204 if the visible transaction is already untagged; 404 if either resource is missing/inaccessible. Recalculate automatic membership.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }

  /trips/{tripId}/excluded-transactions/{transactionId}:
    parameters:
      - $ref: '#/components/parameters/TripId'
      - $ref: '#/components/parameters/TransactionId'
    put:
      tags: [Trips]
      operationId: excludeTransaction
      summary: Exclude an auto-matched transaction
      description: Returns 204 if already excluded; a new exclusion requires auto membership or returns 409 NOT_AUTO_MEMBER. Unavailable resources return 404.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Excluded }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Trips]
      operationId: restoreTransaction
      summary: Restore an excluded transaction
      description: Returns 204 if the visible pair is already restored; unavailable resources return 404.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Restored }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }

  /spending-analysis:
    get:
      tags: [Analysis]
      operationId: getSpendingAnalysis
      summary: All aggregates for the analysis screen in one call
      description: |
        Requires billingCurrency. Net sums signed billing; count includes positive, negative and zero rows.
        Monthly average uses active complete calendar months only; exclude incomplete and transaction-free months.
        Show zero-valued empty time buckets and labelled missing-category/country groups.
        Previous comparison uses the immediately preceding equal inclusive-day range.
        Year-over-year maps February 29 to February 28 in non-leap years. Calendar completeness uses UTC.
        No gross/refund/purchase splits, percentage shares or original-currency spending aggregates.
      parameters:
        - name: from
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Date' }
        - name: to
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Date' }
        - name: compare
          in: query
          schema: { type: string, enum: [none, previous, yoy], default: none }
        - name: billingCurrency
          in: query
          required: true
          schema: { $ref: '#/components/schemas/CurrencyCode' }
        - name: groupBy
          in: query
          schema:
            $ref: '#/components/schemas/Dimension'
            default: category
        - name: bucket
          in: query
          description: Concrete bucket; client resolves "auto". Weeks start Monday. "Today" (complete vs partial buckets) is computed in UTC.
          schema:
            $ref: '#/components/schemas/Bucket'
            default: month
        - name: seriesBy
          in: query
          schema:
            $ref: '#/components/schemas/Dimension'
            default: category
        - name: include
          in: query
          style: form
          explode: false
          schema:
            type: array
            items: { type: string, enum: [groups, timeSeries, matrix] }
            default: [groups, timeSeries, matrix]
        - $ref: '#/components/parameters/CategoryFilter'
        - $ref: '#/components/parameters/CustomCategoryFilter'
        - $ref: '#/components/parameters/CardIdFilter'
        - $ref: '#/components/parameters/CurrencyFilter'
        - $ref: '#/components/parameters/TypeFilter'
        - $ref: '#/components/parameters/TripIdFilter'
        - $ref: '#/components/parameters/CountryFilter'
        - $ref: '#/components/parameters/MerchantFilter'
        - $ref: '#/components/parameters/MinAmount'
        - $ref: '#/components/parameters/MaxAmount'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpendingAnalysis' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /currency-validation-queue:
    get:
      tags: [CurrencyValidation]
      operationId: getCurrencyValidationQueue
      summary: Queue progress, tab counts, country options and manual currency picker
      description: |
        Missing original currency on foreign transactions only; domestic original=null is not unknown currency.
        total = eligible pending UNKNOWN_CURRENCY rows + validated currency_validations rows.
        Currency choices use every pycountry bundled ISO 4217 entry except XXX and XTS.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrencyValidationQueue' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /currency-validation-queue/items:
    get:
      tags: [CurrencyValidation]
      operationId: listCurrencyValidationItems
      summary: Pending / validated rows
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [PENDING, VALIDATED], default: PENDING }
        - $ref: '#/components/parameters/CountryFilter'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/MerchantFilter'
        - name: sort
          in: query
          schema: { type: string, default: -transactionDate }
        - $ref: '#/components/parameters/Page'
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 40 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, meta]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CurrencyValidationItem' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /currency-validation-batches:
    post:
      tags: [CurrencyValidation]
      operationId: createCurrencyValidationBatch
      summary: Manually validate currency for one row, selected rows or all filtered pending rows
      description: |
        For each row: sets transactions.original_currency, deletes the UNKNOWN_CURRENCY review reason and writes a
        currency_validations audit row in a new batch. Immutable source_original_currency never changes.
        Currency must be in the pycountry catalogue excluding XXX/XTS. Exactly one target (IDs or filter).
        Deduplicate IDs. Any missing/inaccessible explicit ID rejects the whole batch with generic 404.
        An accessible already-validated explicit row rejects the whole batch with 409 ALREADY_VALIDATED.
        An empty filter match creates a 201 empty batch with validatedCount=0 and transactionIds=[].
        No transaction-count business cap, truncation or separately committed sub-batches; all changes are atomic.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CurrencyValidationBatchRequest' }
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '201':
          description: Created
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrencyValidationBatch' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /currency-validation-batches/{batchId}:
    parameters:
      - name: batchId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Id' }
    delete:
      tags: [CurrencyValidation]
      operationId: undoCurrencyValidationBatch
      summary: Undo a validation batch
      description: |
        Reset effective original_currency to NULL, re-insert UNKNOWN_CURRENCY and delete validation audit.
        Do not change source_original_currency. Retain original batch membership/count or equivalent evidence.
        Only later currency/validation-state changes invalidate undo; category/trip edits do not.
        If any member changed currency state, return 409 and change nothing. Already-undone visible batches return 204.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Undone }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /currency-validations/{transactionId}:
    parameters:
      - $ref: '#/components/parameters/TransactionId'
    delete:
      tags: [CurrencyValidation]
      operationId: deleteCurrencyValidation
      summary: Move a validated row back to the queue
      description: |
        Reset effective original_currency to NULL, re-insert UNKNOWN_CURRENCY and delete validation audit.
        Immutable source_original_currency and original batch invalidation evidence remain unchanged.
        Already-pending visible transactions return 204; missing/inaccessible transactions return 404.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Moved back }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }

  /categorization:
    get:
      tags: [Categorization]
      operationId: getCategorization
      summary: Category mapping screen overview
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategorizationOverview' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /custom-categories:
    post:
      tags: [Categorization]
      operationId: createCustomCategory
      summary: Create custom category
      description: Trim names; enforce case-insensitive per-user uniqueness while preserving display case. The name none is reserved.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomCategory' }
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomCategory' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfValidationFailed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /category-mappings/{bankCategory}:
    parameters:
      - name: bankCategory
        in: path
        required: true
        description: URL-encoded raw bank category.
        schema: { type: string }
    put:
      tags: [Categorization]
      operationId: putCategoryMapping
      summary: Map a bank category to a custom category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customCategory]
              properties:
                customCategory: { type: string }
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryMapping' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Categorization]
      operationId: deleteCategoryMapping
      summary: Reset a bank category mapping
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Reset }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }

  /category-rules:
    post:
      tags: [Categorization]
      operationId: createCategoryRule
      summary: Add a merchant-text rule (also used to undo a delete)
      description: |
        ANY normalized term matches as a case-insensitive merchant substring, not regex or notes.
        Newest matching rule wins after manual override, before mapping and bank category.
        Undo of deletion creates a new, newest rule; it does not restore original priority. No position field.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [terms, category]
              properties:
                terms:
                  type: array
                  minItems: 1
                  items: { type: string, minLength: 1 }
                category: { type: string }
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryRule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfValidationFailed' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /category-rules/{ruleId}:
    parameters:
      - name: ruleId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Id' }
    delete:
      tags: [Categorization]
      operationId: deleteCategoryRule
      summary: Delete a rule
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    sessionCookie:
      type: apiKey
      in: cookie
      name: session

  headers:
    Location:
      description: URL of the created resource
      schema: { type: string }

  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required for cookie-only mutations, not bearer-authenticated requests; missing/invalid returns 403 CSRF_VALIDATION_FAILED.
      schema: { type: string }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    From:
      name: from
      in: query
      schema: { $ref: '#/components/schemas/Date' }
    To:
      name: to
      in: query
      schema: { $ref: '#/components/schemas/Date' }
    CardId:
      name: cardId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    TransactionId:
      name: transactionId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    TripId:
      name: tripId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    CategoryFilter:
      name: category
      in: query
      description: Effective category (Hebrew bank name or custom name; the client translates English input via its i18n dictionary). Repeat for OR.
      explode: true
      schema: { type: array, items: { type: string } }
    CustomCategoryFilter:
      name: customCategory
      in: query
      description: Custom category name, or "none" for no effective custom category from override, rule or mapping.
      explode: true
      schema: { type: array, items: { type: string } }
    CardIdFilter:
      name: cardId
      in: query
      explode: true
      schema: { type: array, items: { $ref: '#/components/schemas/Id' } }
    CurrencyFilter:
      name: currency
      in: query
      description: Effective original/purchase currency. UNKNOWN means foreign rows with missing original currency, not domestic original=null.
      explode: true
      schema:
        type: array
        items:
          oneOf:
            - { $ref: '#/components/schemas/CurrencyCode' }
            - { const: UNKNOWN }
    BillingCurrency:
      name: billingCurrency
      in: query
      description: Billing currency; required when minAmount or maxAmount is supplied. No implicit ILS default.
      schema: { $ref: '#/components/schemas/CurrencyCode' }
    MinAmount:
      name: minAmount
      in: query
      description: Inclusive signed billing amount bound; requires explicit billingCurrency.
      schema: { $ref: '#/components/schemas/Decimal' }
    MaxAmount:
      name: maxAmount
      in: query
      description: Inclusive signed billing amount bound; requires explicit billingCurrency.
      schema: { $ref: '#/components/schemas/Decimal' }
    MerchantFilter:
      name: merchant
      in: query
      description: Merchant name contains. Repeat for OR.
      explode: true
      schema: { type: array, items: { type: string } }
    TypeFilter:
      name: type
      in: query
      explode: true
      schema: { type: array, items: { $ref: '#/components/schemas/TransactionType' } }
    CountryFilter:
      name: country
      in: query
      description: ISO 3166-1 alpha-2 merchant country code. Repeat for OR.
      explode: true
      schema: { type: array, items: { $ref: '#/components/schemas/CountryCode' } }
    TripIdFilter:
      name: tripId
      in: query
      description: Trip id, or "none".
      explode: true
      schema: { type: array, items: { type: string } }

  responses:
    CsrfValidationFailed:
      description: Missing or invalid CSRF on a cookie-only mutation (CSRF_VALIDATION_FAILED)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    BadRequest:
      description: Malformed request or invalid query parameter
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Not authenticated
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Not found or not visible to the caller
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Conflicting state
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PayloadTooLarge:
      description: File too large (FILE_TOO_LARGE)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnsupportedMediaType:
      description: Not an .xlsx workbook (UNSUPPORTED_FILE_TYPE)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationError:
      description: Semantic validation failed
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Rate limited
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Id:
      type: string
      description: Opaque identifier
    Date:
      type: string
      format: date
    Timestamp:
      type: string
      format: date-time
    Decimal:
      type: string
      pattern: '^-?\d+(\.\d+)?$'
    Rate:
      type: string
      pattern: '^\d+\.\d{6}$'
      description: Nonnegative FX/implied-rate magnitude; preserve stored signed ratios and source original amounts.
    CurrencyCode:
      type: string
      pattern: '^[A-Z]{3}$'
      not:
        enum: [XXX, XTS]
      description: Must belong to pycountry's bundled ISO 4217 catalogue, excluding XXX/XTS; service membership validation is required beyond the shape check.
    CountryCode:
      type: string
      pattern: '^[A-Z]{2}$'
      description: ISO 3166-1 alpha-2. Country names are rendered by the frontend i18n dictionary.
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: string, pattern: '^-?\d+\.\d{2}$' }
        currency:
          type: [string, 'null']
          pattern: '^[A-Z]{3}$'
          description: null when the currency is unknown
    Issuer:
      type: string
      enum: [ISRACARD, MAX, CAL]
    TransactionType:
      type: string
      enum: [REGULAR, INSTALLMENTS, RECURRING, IMMEDIATE_CHARGE]
    ReviewReason:
      type: string
      description: |
        User-visible review reasons. v1 exposes UNKNOWN_CURRENCY only (resolved in the currency-validation queue).
        The database enum also holds UNMATCHED_FOREIGN_FEE and AMBIGUOUS_INSTALLMENT; they are still stored for
        monitoring but are never returned or accepted by the API.
      enum: [UNKNOWN_CURRENCY]
    ImportStatus:
      type: string
      enum: [RUNNING, SUCCESS, PARTIAL, NEEDS_INPUT, FAILED]
    CategorySource:
      type: string
      enum: [OVERRIDE, RULE, MAPPING, BANK]
    Dimension:
      type: string
      enum: [category, customCategory, day, week, month, year, card, currency, merchant, type, trip, country]
    Bucket:
      type: string
      enum: [day, week, month, year]

    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        instance: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, code, message]
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }

    PageMeta:
      type: object
      required: [page, pageSize, totalItems, totalPages]
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        totalItems: { type: integer }
        totalPages: { type: integer }

    Person:
      type: object
      description: Statement-holder metadata, not app-user identity or authorization.
      required: [name]
      properties:
        name: { type: string }

    ReviewReasonCount:
      type: object
      required: [reason, count]
      properties:
        reason: { $ref: '#/components/schemas/ReviewReason' }
        count: { type: integer, minimum: 0 }

    Me:
      type: object
      required: [id, name, email, role, csrfToken, counters]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [OWNER], description: Constant label. }
        csrfToken: { type: string }
        counters:
          type: object
          required: [pendingCurrencyValidations, needsReviewByReason]
          properties:
            pendingCurrencyValidations: { type: integer }
            needsReviewByReason:
              type: array
              description: One entry per user-visible ReviewReason (v1 = UNKNOWN_CURRENCY only) that has at least one transaction.
              items: { $ref: '#/components/schemas/ReviewReasonCount' }

    CardRef:
      type: object
      required: [id, label, issuer, last4, nickname, ownerName]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        label: { type: string }
        issuer: { $ref: '#/components/schemas/Issuer' }
        last4: { type: string, pattern: '^\d{4}$' }
        nickname: { type: [string, 'null'] }
        ownerName: { type: string }

    Card:
      type: object
      required: [id, label, issuer, last4, nickname, owner]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        label: { type: string }
        issuer: { $ref: '#/components/schemas/Issuer' }
        last4: { type: string, pattern: '^\d{4}$' }
        nickname: { type: [string, 'null'] }
        owner: { $ref: '#/components/schemas/Person' }

    IdentitySelection:
      oneOf:
        - type: object
          required: [questionId, action, cardId]
          properties:
            questionId: { type: string }
            action: { const: USE_EXISTING_CARD }
            cardId: { $ref: '#/components/schemas/Id' }
        - type: object
          required: [questionId, action]
          properties:
            questionId: { type: string }
            action: { const: CREATE_CARD }
            nickname: { type: [string, 'null'], maxLength: 120 }

    IdentityQuestion:
      type: object
      required: [id, reason, issuer, last4, candidates, allowedActions]
      properties:
        id:
          type: string
          description: Deterministic (derived from issuer + card hint, e.g. a hash) so it is stable when the same file is re-uploaded.
        reason: { type: string, enum: [NO_MATCHING_CARD, AMBIGUOUS_CARDS, CONFLICTING_HINTS] }
        issuer: { $ref: '#/components/schemas/Issuer' }
        last4: { type: [string, 'null'], pattern: '^\d{4}$' }
        candidates:
          type: array
          items: { $ref: '#/components/schemas/CardRef' }
        allowedActions:
          type: array
          items: { type: string, enum: [USE_EXISTING_CARD, CREATE_CARD] }

    ImportIssue:
      type: object
      description: Response-only (not persisted). The UI shows "Sheet {sheetPosition}"; sheet names are never returned.
      required: [sheetPosition, row, code, severity, message]
      properties:
        sheetPosition: { type: integer, minimum: 1 }
        row: { type: integer }
        code:
          type: string
          enum: [PENDING_TRANSACTION, MALFORMED_ROW, INVALID_DATE, INVALID_AMOUNT, MISSING_REQUIRED_VALUE, MISSING_OR_ZERO_FX_ORIGINAL_AMOUNT, TOTALS_MISMATCH]
        severity: { type: string, enum: [INFO, WARNING, ERROR] }
        message: { type: string }

    ImportCounts:
      type: object
      required: [read, imported, duplicate, skipped, needsReview, needsReviewByReason]
      properties:
        read: { type: integer }
        imported: { type: integer }
        duplicate: { type: integer }
        skipped: { type: integer }
        needsReview:
          type: integer
          description: Rows (would be) imported with a user-visible review reason (v1 = UNKNOWN_CURRENCY only). Computed from the import report, not stored.
        needsReviewByReason:
          type: array
          description: Non-zero counts per user-visible ReviewReason (v1 = UNKNOWN_CURRENCY only).
          items: { $ref: '#/components/schemas/ReviewReasonCount' }

    ImportResult:
      type: object
      required: [id, status, dryRun, issuer, sha256, startedAt, counts, warnings, issues, identityQuestions]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        status: { type: string, enum: [SUCCESS, PARTIAL, NEEDS_INPUT, FAILED], description: Terminal result of synchronous import; RUNNING is internal audit state only. }
        dryRun: { type: boolean }
        issuer:
          $ref: '#/components/schemas/Issuer'
          description: Detected issuer; unsupported bank format returns 422 UNKNOWN_STATEMENT_FORMAT instead of an ImportResult.
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        startedAt: { $ref: '#/components/schemas/Timestamp' }
        counts: { $ref: '#/components/schemas/ImportCounts' }
        warnings: { type: array, items: { type: string } }
        issues:
          type: array
          items: { $ref: '#/components/schemas/ImportIssue' }
        identityQuestions:
          type: array
          items: { $ref: '#/components/schemas/IdentityQuestion' }

    ImportSummary:
      type: object
      required: [id, sha256, startedAt, status, rowsImported]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        sha256: { type: string }
        startedAt: { $ref: '#/components/schemas/Timestamp' }
        status: { type: string, enum: [SUCCESS, PARTIAL] }
        rowsImported: { type: integer }

    Category:
      type: object
      description: Override wins over newest matching rule, then mapping, then bank category. Bank names are Hebrew; English labels come from frontend i18n.
      required: [bank, custom, effective, source]
      properties:
        bank: { type: [string, 'null'] }
        custom: { type: [string, 'null'] }
        effective: { type: [string, 'null'] }
        source: { $ref: '#/components/schemas/CategorySource' }

    TripRef:
      type: object
      required: [id, name, membership]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        membership: { type: string, enum: [TAGGED, AUTO] }

    TransactionListItem:
      type: object
      required: [id, transactionDate, chargeDate, merchant, city, country, category, card, type, installment, original, billing, effectiveRate, commission, trip, notes, reviewReasons]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        transactionDate: { $ref: '#/components/schemas/Date' }
        chargeDate:
          oneOf:
            - { $ref: '#/components/schemas/Date' }
            - { type: 'null' }
        merchant: { type: string }
        city: { type: [string, 'null'] }
        country: { type: [string, 'null'] }
        category: { $ref: '#/components/schemas/Category' }
        card: { $ref: '#/components/schemas/CardRef' }
        type: { $ref: '#/components/schemas/TransactionType' }
        installment:
          oneOf:
            - type: object
              required: [number, total]
              properties:
                number: { type: integer }
                total: { type: integer }
            - { type: 'null' }
        original:
          oneOf:
            - { $ref: '#/components/schemas/Money' }
            - { type: 'null' }
        billing: { $ref: '#/components/schemas/Money' }
        effectiveRate:
          oneOf:
            - { $ref: '#/components/schemas/Rate' }
            - { type: 'null' }
        commission:
          oneOf:
            - { $ref: '#/components/schemas/Money' }
            - { type: 'null' }
        trip:
          description: The single trip this transaction belongs to, or null.
          oneOf:
            - { $ref: '#/components/schemas/TripRef' }
            - { type: 'null' }
        notes: { type: [string, 'null'] }
        reviewReasons:
          type: array
          description: User-visible review reasons only (v1 = UNKNOWN_CURRENCY). The detail panel links it to the currency-validation queue; there is no generic "Mark as reviewed".
          items: { $ref: '#/components/schemas/ReviewReason' }

    TransactionDetail:
      allOf:
        - $ref: '#/components/schemas/TransactionListItem'
        - type: object
          required: [fx, installmentPlan, importedAt]
          properties:
            fx:
              oneOf:
                - type: object
                  required: [statedRate, effectiveRate, deviationPercent, commission]
                  properties:
                    statedRate:
                      oneOf:
                        - { $ref: '#/components/schemas/Rate' }
                        - { type: 'null' }
                    effectiveRate: { $ref: '#/components/schemas/Rate' }
                    deviationPercent:
                      oneOf:
                        - { $ref: '#/components/schemas/Decimal' }
                        - { type: 'null' }
                    commission: { $ref: '#/components/schemas/Money' }
                - { type: 'null' }
            installmentPlan:
              oneOf:
                - type: object
                  required: [number, total, planTotal, perPayment, remainingPayments, remainingAmount]
                  properties:
                    number: { type: integer }
                    total: { type: integer }
                    planTotal: { $ref: '#/components/schemas/Money' }
                    perPayment: { $ref: '#/components/schemas/Money' }
                    remainingPayments: { type: integer }
                    remainingAmount: { $ref: '#/components/schemas/Money' }
                - { type: 'null' }
            importedAt: { $ref: '#/components/schemas/Timestamp' }

    BillingTotal:
      type: object
      description: Signed billing net and row count for one known currency. Count includes positive, negative and zero rows; retain the entry even when net is zero.
      required: [count, net]
      properties:
        count: { type: integer, minimum: 1 }
        net:
          allOf:
            - $ref: '#/components/schemas/Money'
            - type: object
              properties:
                currency: { $ref: '#/components/schemas/CurrencyCode' }

    BillingSummary:
      type: object
      description: |
        All-row count and one billingTotals entry per known billing currency, with no cross-currency sum.
        Missing billing currency contributes only to count and unknownBillingCurrencyCount, never monetary sums.
        count = sum of billingTotals counts + unknownBillingCurrencyCount. Empty sets return billingTotals=[].
        No per-transaction average is exposed.
      required: [count, unknownBillingCurrencyCount, billingTotals]
      properties:
        count: { type: integer, minimum: 0 }
        unknownBillingCurrencyCount: { type: integer, minimum: 0 }
        billingTotals:
          type: array
          items: { $ref: '#/components/schemas/BillingTotal' }

    TransactionSummary:
      allOf:
        - $ref: '#/components/schemas/BillingSummary'
        - type: object
          required: [unknownCurrencyCount]
          properties:
            unknownCurrencyCount:
              type: integer
              minimum: 0
              description: Foreign rows with missing original currency; distinct from unknownBillingCurrencyCount.

    TransactionGroup:
      description: Known keys retain their grouping value. Missing category/customCategory/country uses key=null with label Uncategorized / No custom category / Unknown country, respectively. Clients may localize labels.
      allOf:
        - $ref: '#/components/schemas/BillingSummary'
        - type: object
          required: [key, label]
          properties:
            key: { type: [string, 'null'] }
            label: { type: string }

    CurrencyCount:
      type: object
      required: [code, count]
      properties:
        code: { $ref: '#/components/schemas/CurrencyCode' }
        count: { type: integer, minimum: 1 }

    FilterOptions:
      type: object
      description: |
        Options/counts cover the caller's whole transaction dataset, not a filtered page.
        currencies lists effective original/purchase currencies; unknownCurrencyCount excludes domestic original=null.
        billingCurrencies lists only known billing currencies present in that dataset with their all-row counts.
        Missing billing currency is counted separately in unknownBillingCurrencyCount, never relabelled ILS.
        Currency names come from the shared code/name catalogue; these counts are not spending totals.
      required: [categories, customCategories, cards, currencies, unknownCurrencyCount, billingCurrencies, unknownBillingCurrencyCount, types, countries, trips, dateRange]
      properties:
        categories:
          type: array
          items:
            type: object
            required: [bank, count]
            properties:
              bank: { type: string }
              count: { type: integer }
        customCategories:
          type: array
          items:
            type: object
            required: [name, count]
            properties:
              name: { type: string }
              count: { type: integer }
        cards:
          type: array
          items: { $ref: '#/components/schemas/CardRef' }
        currencies:
          type: array
          items: { $ref: '#/components/schemas/CurrencyCount' }
        unknownCurrencyCount: { type: integer }
        billingCurrencies:
          type: array
          items: { $ref: '#/components/schemas/CurrencyCount' }
        unknownBillingCurrencyCount: { type: integer, minimum: 0 }
        types:
          type: array
          items: { $ref: '#/components/schemas/TransactionType' }
        countries:
          type: array
          items: { $ref: '#/components/schemas/CountryOption' }
        trips:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { $ref: '#/components/schemas/Id' }
              name: { type: string }
        dateRange:
          type: object
          required: [min, max]
          properties:
            min:
              oneOf:
                - { $ref: '#/components/schemas/Date' }
                - { type: 'null' }
            max:
              oneOf:
                - { $ref: '#/components/schemas/Date' }
                - { type: 'null' }

    CountryOption:
      type: object
      required: [code, count]
      properties:
        code: { $ref: '#/components/schemas/CountryCode' }
        count: { type: integer }

    TripSummary:
      type: object
      required: [id, name, currency, startDate, endDate, days, stats]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        startDate: { $ref: '#/components/schemas/Date' }
        endDate: { $ref: '#/components/schemas/Date' }
        days: { type: integer }
        stats:
          allOf:
            - $ref: '#/components/schemas/BillingSummary'
            - type: object
              required: [taggedCount, autoCount]
              properties:
                taggedCount: { type: integer }
                autoCount: { type: integer }

    TripDetail:
      type: object
      required: [id, name, currency, startDate, endDate, days, stats, byCategory, byDay, tagged, auto, excluded]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        startDate: { $ref: '#/components/schemas/Date' }
        endDate: { $ref: '#/components/schemas/Date' }
        days: { type: integer }
        stats:
          allOf:
            - $ref: '#/components/schemas/BillingSummary'
            - type: object
              required: [unknownCurrencyCount, outsideRange]
              properties:
                unknownCurrencyCount: { type: integer }
                outsideRange: { $ref: '#/components/schemas/BillingSummary' }
        byCategory:
          type: array
          items:
            description: Missing effective category uses category=null and label=Uncategorized; retain its count and billing totals. Known labels use the category name.
            allOf:
              - $ref: '#/components/schemas/BillingSummary'
              - type: object
                required: [category, label]
                properties:
                  category: { type: [string, 'null'] }
                  label: { type: string }
        byDay:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/BillingSummary'
              - type: object
                required: [date]
                properties:
                  date: { $ref: '#/components/schemas/Date' }
        tagged:
          type: array
          items: { $ref: '#/components/schemas/TransactionListItem' }
        auto:
          type: array
          items: { $ref: '#/components/schemas/TransactionListItem' }
        excluded:
          type: array
          items: { $ref: '#/components/schemas/TransactionListItem' }

    AnalysisTotals:
      type: object
      description: Signed billing aggregates in the required billingCurrency; count includes all positive, negative and zero rows.
      required: [net, count, monthlyAverage]
      properties:
        net: { $ref: '#/components/schemas/Money' }
        count: { type: integer }
        monthlyAverage:
          type: object
          required: [value, completeBuckets, partialBuckets]
          properties:
            value:
              oneOf:
                - { $ref: '#/components/schemas/Money' }
                - { type: 'null' }
            completeBuckets:
              type: integer
              description: Number of active complete calendar months, independent of the chart bucket.
            partialBuckets: { type: array, items: { type: string } }

    AnalysisGroup:
      type: object
      description: Include missing groups with key=null and fallback label Uncategorized / No custom category / Unknown country for category/customCategory/country. Known keys remain unchanged; clients may localize labels.
      required: [key, label, net, count, previous]
      properties:
        key: { type: [string, 'null'] }
        label: { type: string }
        net: { $ref: '#/components/schemas/Money' }
        count: { type: integer }
        previous:
          oneOf:
            - type: object
              required: [net, count]
              properties:
                net: { $ref: '#/components/schemas/Money' }
                count: { type: integer }
            - { type: 'null' }

    TimePoint:
      type: object
      description: Signed billing in the selected billingCurrency; include empty period buckets with zero amounts.
      required: [key, start, end, net, complete]
      properties:
        key: { type: string }
        start: { $ref: '#/components/schemas/Date' }
        end: { $ref: '#/components/schemas/Date' }
        net: { $ref: '#/components/schemas/Money' }
        complete: { type: boolean }

    SpendingAnalysis:
      type: object
      required: [range, comparisonRange, totals, comparisonTotals]
      properties:
        range:
          $ref: '#/components/schemas/DateRange'
        comparisonRange:
          oneOf:
            - { $ref: '#/components/schemas/DateRange' }
            - { type: 'null' }
        totals: { $ref: '#/components/schemas/AnalysisTotals' }
        comparisonTotals:
          oneOf:
            - { $ref: '#/components/schemas/AnalysisTotals' }
            - { type: 'null' }
        groups:
          type: array
          items: { $ref: '#/components/schemas/AnalysisGroup' }
        timeSeries:
          type: object
          required: [bucket, average, points, previous]
          properties:
            bucket: { $ref: '#/components/schemas/Bucket' }
            average:
              description: For month buckets use active complete-month average; null when undefined. Always null for day/week/year buckets; no daily, weekly, or yearly average is computed. The monthly-average stat remains available independently of the chart bucket.
              oneOf:
                - { $ref: '#/components/schemas/Money' }
                - { type: 'null' }
            points:
              type: array
              items: { $ref: '#/components/schemas/TimePoint' }
            previous:
              oneOf:
                - type: object
                  required: [average, points]
                  properties:
                    average:
                      description: Comparison average follows the same bucket policy, using the comparison range's active complete-month average for month buckets; null when undefined. Always null for day/week/year buckets.
                      oneOf:
                        - { $ref: '#/components/schemas/Money' }
                        - { type: 'null' }
                    points:
                      type: array
                      items: { $ref: '#/components/schemas/TimePoint' }
                - { type: 'null' }
        matrix:
          type: object
          required: [rowDimension, bucket, columns, rows, columnTotals]
          properties:
            rowDimension: { $ref: '#/components/schemas/Dimension' }
            bucket: { $ref: '#/components/schemas/Bucket' }
            columns:
              type: array
              items:
                type: object
                required: [key, complete]
                properties:
                  key: { type: string }
                  complete: { type: boolean }
            rows:
              type: array
              items:
                type: object
                required: [key, label, cells, total]
                properties:
                  key:
                    type: [string, 'null']
                    description: Null for a missing category/customCategory/country row; use the corresponding group fallback label.
                  label: { type: string }
                  cells:
                    type: array
                    items:
                      type: object
                      required: [net]
                      properties:
                        net: { $ref: '#/components/schemas/Money' }
                  total: { $ref: '#/components/schemas/Money' }
            columnTotals:
              type: array
              items: { $ref: '#/components/schemas/Money' }

    DateRange:
      type: object
      required: [from, to]
      properties:
        from: { $ref: '#/components/schemas/Date' }
        to: { $ref: '#/components/schemas/Date' }

    CurrencyCatalogueEntry:
      type: object
      required: [code, name]
      properties:
        code: { $ref: '#/components/schemas/CurrencyCode' }
        name:
          type: string
          minLength: 1
          description: Currency name from pycountry's bundled catalogue; supports local code/name search.

    CurrencyValidationQueue:
      type: object
      required: [total, validated, pending, progressPercent, countries, currencyOptions]
      properties:
        total: { type: integer }
        validated: { type: integer }
        pending: { type: integer }
        progressPercent: { $ref: '#/components/schemas/Decimal' }
        countries:
          type: array
          items: { $ref: '#/components/schemas/CountryOption' }
        currencyOptions:
          type: array
          description: Code/name entries for all currencies in pycountry's bundled ISO 4217 catalogue except XXX/XTS. Search locally by either field; unsupported validation choice returns 422. No per-keystroke endpoint.
          items: { $ref: '#/components/schemas/CurrencyCatalogueEntry' }

    CurrencyValidationItem:
      type: object
      required: [id, transactionDate, merchant, country, originalAmount, billing, impliedRate, validation]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        transactionDate: { $ref: '#/components/schemas/Date' }
        merchant: { type: string }
        country: { type: [string, 'null'] }
        originalAmount: { $ref: '#/components/schemas/Decimal' }
        billing: { $ref: '#/components/schemas/Money' }
        impliedRate:
          oneOf:
            - { $ref: '#/components/schemas/Rate' }
            - { type: 'null' }
        validation:
          oneOf:
            - type: object
              required: [currency, batchId, validatedAt]
              properties:
                currency: { $ref: '#/components/schemas/CurrencyCode' }
                batchId: { $ref: '#/components/schemas/Id' }
                validatedAt: { $ref: '#/components/schemas/Timestamp' }
            - { type: 'null' }

    CurrencyValidationFilter:
      type: object
      additionalProperties: false
      properties:
        country: { type: array, items: { $ref: '#/components/schemas/CountryCode' } }
        from: { $ref: '#/components/schemas/Date' }
        to: { $ref: '#/components/schemas/Date' }
        merchant:
          type: array
          description: Merchant name contains (OR).
          items: { type: string }

    CurrencyValidationBatchRequest:
      type: object
      additionalProperties: false
      required: [currency]
      description: Required explicit currency and exactly one of transactionIds/filter. Deduplicate IDs; no business count cap. Filter selects every matching pending row.
      properties:
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        transactionIds:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Id' }
        filter: { $ref: '#/components/schemas/CurrencyValidationFilter' }
      allOf:
        - oneOf:
            - { required: [transactionIds] }
            - { required: [filter] }

    CurrencyValidationBatch:
      type: object
      required: [id, validatedCount, transactionIds, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        validatedCount: { type: integer }
        transactionIds:
          type: array
          items: { $ref: '#/components/schemas/Id' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }

    CustomCategory:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }

    CategoryMapping:
      type: object
      required: [bankCategory, customCategory]
      properties:
        bankCategory: { type: string }
        customCategory: { type: string }

    CategoryRule:
      type: object
      description: Newest matching rule wins after override; match ANY merchant substring term. Deletion undo creates a new, newest rule.
      required: [id, terms, category, stats]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        terms: { type: array, items: { type: string } }
        category: { type: string }
        stats:
          type: object
          required: [matched]
          properties:
            matched: { type: integer }

    CategorizationOverview:
      type: object
      required: [bankCategories, rules, customCategories, resultingCategories]
      properties:
        bankCategories:
          type: array
          items:
            type: object
            required: [name, count, mappedTo]
            properties:
              name: { type: string }
              count: { type: integer }
              mappedTo: { type: [string, 'null'] }
        rules:
          type: array
          items: { $ref: '#/components/schemas/CategoryRule' }
        customCategories:
          type: array
          items: { $ref: '#/components/schemas/CustomCategory' }
        resultingCategories:
          type: array
          items:
            type: object
            required: [name, count]
            properties:
              name: { type: string }
              count: { type: integer }
